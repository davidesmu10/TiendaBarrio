<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Tienda de Barrio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <h1><a href="index.html">Tienda de Barrio</a></h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="products.html">Productos</a>
            <a href="contact.html">Contacto</a>
            <a href="cart.html" class="cart-icon active"><i class="fas fa-shopping-cart"></i> <span id="cart-count">0</span></a>
        </nav>
    </header>

    <main class="container">
        <div id="cart-view">
            <h2>Tu Carrito</h2>
            <div class="cart-page">
                <div class="cart-items">
                    <!-- Los items del carrito se cargarán aquí -->
                </div>
                <div class="cart-summary">
                    <h3>Resumen del Pedido</h3>
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="summary-subtotal">$0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Envío:</span>
                        <span>$5.00</span>
                    </div>
                    <div class="summary-row summary-total">
                        <span>Total:</span>
                        <span id="summary-total">$5.00</span>
                    </div>
                    <button id="checkout-button" class="btn btn-primary">Proceder al Pago</button>
                </div>
            </div>
        </div>

        <div id="payment-view" style="display: none;">
            <div class="payment-container">
                <div class="payment-form">
                    <h2>Pasarela de Pago</h2>
                    <div class="card-icon">
                        <img src="https://www.flaticon.com/svg/static/icons/svg/349/349221.svg" alt="Credit Card" width="50">
                    </div>
                    <form id="payment-form">
                        <div class="form-group">
                            <label for="card-name">Nombre en la Tarjeta</label>
                            <input type="text" id="card-name" placeholder="Juan Pérez" required>
                        </div>
                        <div class="form-group">
                            <label for="card-number">Número de Tarjeta</label>
                            <input type="text" id="card-number" placeholder="1234 5678 9876 5432" required>
                        </div>
                        <div class="card-details">
                            <div class="form-group">
                                <label for="expiry-date">Fecha de Expiración</label>
                                <input type="text" id="expiry-date" placeholder="MM/YY" required>
                            </div>
                            <div class="form-group">
                                <label for="cvv">CVV</label>
                                <input type="text" id="cvv" placeholder="123" required>
                            </div>
                        </div>
                        <button type="submit" class="submit-btn">Pagar de forma segura</button>
                    </form>
                </div>
            </div>
        </div>

        <div id="confirmation-view" style="display: none;">
            <h2>¡Gracias por tu compra!</h2>
            <p>Tu pedido ha sido confirmado y se está procesando.</p>
            <a href="index.html" class="btn btn-primary">Volver al Inicio</a>
        </div>
    </main>

    <script src="cart.js"></script>
</body>
</html>
