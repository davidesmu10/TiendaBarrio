<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Carrito de Compras - Tienda de Barrio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1><a href="index.html">Tienda de Barrio</a></h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="products.html">Productos</a>
            <a href="contact.html">Contacto</a>
            <a href="cart.html" class="active cart-icon">🛒 <span id="cart-count">0</span></a>
        </nav>
    </header>

    <main class="container">
        <h2>Tu Carrito de Compras</h2>

        <div id="cart-page-container">
            <!-- Mensaje de Carrito Vacío -->
            <div id="empty-cart-message" style="display: none; text-align: center;">
                <p>Tu carrito está vacío.</p>
                <a href="products.html" class="btn btn-primary">Ver productos</a>
            </div>

            <!-- Contenedor de Items del Carrito -->
            <div id="cart-items-container"></div>

            <!-- Resumen del Pedido -->
            <div id="cart-summary" style="display: none;">
                <h3>Resumen del Pedido</h3>
                <div class="total-row">
                    <span>Total</span>
                    <span id="cart-total">$0.00</span>
                </div>
                <button class="btn btn-primary btn-checkout">Finalizar Compra</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Tienda de Barrio. Todos los derechos reservados.</p>
    </footer>

    <!-- ¡LA CONEXIÓN QUE FALTABA! -->
    <script src="cart.js"></script>
</body>
</html>
