<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra - Tienda de Barrio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1><a href="index.html">Tienda de Barrio</a></h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="products.html">Productos</a>
            <a href="contact.html">Contacto</a>
            <a href="cart.html" class="cart-icon">🛒 <span id="cart-count">0</span></a>
        </nav>
    </header>

    <main class="container">
        <h2>Finalizar Compra</h2>
        <div class="checkout-form">
            <form id="checkout-form">
                <h3>Información de Envío</h3>
                <div class="form-group">
                    <label for="name">Nombre Completo</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="address">Dirección de Entrega</label>
                    <input type="text" id="address" name="address" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="city">Ciudad</label>
                        <input type="text" id="city" name="city" required>
                    </div>
                    <div class="form-group">
                        <label for="zip">Código Postal</label>
                        <input type="text" id="zip" name="zip" required>
                    </div>
                </div>

                <h3>Método de Pago</h3>
                <div class="form-group">
                    <label for="payment-method">Selecciona un método</label>
                    <select id="payment-method" name="payment-method">
                        <option value="credit-card">Tarjeta de Crédito</option>
                        <option value="cash">Pago en Efectivo (Contra Entrega)</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary btn-checkout">Confirmar Pedido</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Tienda de Barrio. Todos los derechos reservados.</p>
    </footer>

    <script src="checkout.js"></script>
</body>
</html>
