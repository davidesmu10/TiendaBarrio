<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago - Tienda de Barrio</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .payment-container {
            max-width: 500px;
            margin: 2rem auto;
            padding: 2rem;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .payment-form h2 {
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .card-details {
            display: flex;
            justify-content: space-between;
        }

        .card-details .form-group {
            width: 48%;
        }

        .card-icon {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Tienda de Barrio</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="products.html">Productos</a>
            <a href="orders.html">Pedidos</a>
            <a href="checkout.html">Carrito</a>
        </nav>
    </header>

    <main>
        <div class="payment-container">
            <div class="payment-form">
                <h2>Pasarela de Pago</h2>
                <div class="card-icon">
                    <img src="https://www.flaticon.com/svg/static/icons/svg/349/349221.svg" alt="Credit Card" width="50">
                </div>
                <form id="payment-form">
                    <div class="form-group">
                        <label for="card-name">Nombre en la Tarjeta</label>
                        <input type="text" id="card-name" placeholder="Juan Pérez" required>
                    </div>
                    <div class="form-group">
                        <label for="card-number">Número de Tarjeta</label>
                        <input type="text" id="card-number" placeholder="1234 5678 9876 5432" required>
                    </div>
                    <div class="card-details">
                        <div class="form-group">
                            <label for="expiry-date">Fecha de Expiración</label>
                            <input type="text" id="expiry-date" placeholder="MM/YY" required>
                        </div>
                        <div class="form-group">
                            <label for="cvv">CVV</label>
                            <input type="text" id="cvv" placeholder="123" required>
                        </div>
                    </div>
                    <button type="submit" class="submit-btn">Pagar de forma segura</button>
                </form>
            </div>
        </div>
    </main>

    <script src="checkout.js"></script>
</body>
</html>
